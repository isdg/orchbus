[package]
name = "orchbus-operator"
version = "0.1.0"
edition = "2021"
description = "Reconciles orchbus.io Tasks into agent pods"

[[bin]]
name = "orchbus-operator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
k8s-openapi = { version = "0.28", features = ["v1_36"] }
kube = { version = "4.2", features = ["runtime"] }
orchbus-api = { path = "../orchbus-api" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
