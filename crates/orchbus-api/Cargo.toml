[package]
name = "orchbus-api"
version = "0.1.0"
edition = "2021"
description = "The orchbus.io custom resource types: Task, AgentRole, Workspace, Approval"

[dependencies]
k8s-openapi = { version = "0.28", features = ["schemars"] }
kube = { version = "4.2", default-features = false, features = ["derive", "cel"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
k8s-openapi = { version = "0.28", features = ["schemars", "v1_36"] }
serde-saphyr = "1.3"
