---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentroles.orchbus.io
spec:
  group: orchbus.io
  names:
    categories:
    - orchbus
    kind: AgentRole
    plural: agentroles
    shortNames:
    - ar
    singular: agentrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .spec.authority
      name: Authority
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AgentRoleSpec via `CustomResource`
        properties:
          spec:
            description: "A job description: how an agent in this role is launched and what authority it acts with."
            properties:
              authority:
                default: worker
                enum:
                - worker
                - manager
                type: string
              model:
                nullable: true
                type: string
              permissionMode:
                nullable: true
                type: string
              prompt:
                description: Appended to the agent's system prompt.
                nullable: true
                type: string
              runtime:
                default: claude
                description: Agent CLI the node launches, e.g. `claude`.
                type: string
              skills:
                items:
                  type: string
                type: array
              tools:
                properties:
                  allow:
                    items:
                      type: string
                    type: array
                  deny:
                    items:
                      type: string
                    type: array
                type: object
            type: object
        required:
        - spec
        title: AgentRole
        type: object
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: approvals.orchbus.io
spec:
  group: orchbus.io
  names:
    categories:
    - orchbus
    kind: Approval
    plural: approvals
    shortNames:
    - ap
    singular: approval
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .spec.subject.pod
      name: Subject
      type: string
    - jsonPath: .spec.question
      name: Question
      type: string
    - jsonPath: .spec.decision
      name: Decision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ApprovalSpec via `CustomResource`
        properties:
          spec:
            description: |-
              A decision an agent is blocked on. Who may decide is enforced by admission policy;
              the schema rules here hold for everyone.
            properties:
              choice:
                description: 1-based menu option to select when approved.
                format: int32
                maximum: 9.0
                minimum: 1.0
                nullable: true
                type: integer
              decision:
                default: pending
                enum:
                - pending
                - approved
                - denied
                type: string
              kind:
                enum:
                - permission
                - plan
                - land
                - budget
                type: string
              options:
                default: []
                description: Menu options as shown by the agent, in order.
                items:
                  type: string
                type: array
              question:
                type: string
              subject:
                properties:
                  chain:
                    default: []
                    description: Service accounts of the subject and its ancestors; none of them may decide.
                    items:
                      type: string
                    type: array
                  pod:
                    type: string
                required:
                - pod
                type: object
            required:
            - kind
            - question
            - subject
            type: object
            x-kubernetes-validations:
            - message: kind and subject are immutable
              rule: self.kind == oldSelf.kind && self.subject == oldSelf.subject
            - message: a decision is final
              rule: oldSelf.decision == 'pending' || self.decision == oldSelf.decision
            - message: approving a menu needs a choice
              rule: self.decision != 'approved' || size(self.options) == 0 || has(self.choice)
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Approval
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.orchbus.io
spec:
  group: orchbus.io
  names:
    categories:
    - orchbus
    kind: Task
    plural: tasks
    shortNames:
    - tk
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.role
      name: Role
      type: string
    - jsonPath: .spec.workspace
      name: Workspace
      type: string
    - jsonPath: .status.cost.usd
      name: USD
      priority: 1
      type: number
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for TaskSpec via `CustomResource`
        properties:
          spec:
            description: "A unit of work: an agent in a Role works a prompt in a Workspace until `target` is reached."
            properties:
              priority:
                description: Higher runs first when the namespace is at its agent quota.
                format: int32
                nullable: true
                type: integer
              prompt:
                type: string
              role:
                description: Name of the AgentRole the working agent is started with.
                type: string
              target:
                default: ready
                enum:
                - planned
                - ready
                - landed
                type: string
              workspace:
                nullable: true
                type: string
            required:
            - prompt
            - role
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: >-
                    Condition contains details for one aspect of the current state of this API
                    Resource.
                  properties:
                    lastTransitionTime:
                      description: >-
                        lastTransitionTime is the last time the condition transitioned from one status
                        to another. This should be when the underlying condition changed.  If that is not
                        known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: >-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      type: string
                    observedGeneration:
                      description: >-
                        observedGeneration represents the .metadata.generation that the condition was
                        set based upon. For instance, if .metadata.generation is currently 12, but the
                        .status.conditions[x].observedGeneration is 9, the condition is out of date with
                        respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: >-
                        reason contains a programmatic identifier indicating the reason for the
                        condition's last transition. Producers of specific condition types may define expected
                        values and meanings for this field, and whether the values are considered a
                        guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cost:
                nullable: true
                properties:
                  inputTokens:
                    default: 0
                    format: int64
                    type: integer
                  outputTokens:
                    default: 0
                    format: int64
                    type: integer
                  usd:
                    format: double
                    type: number
                required:
                - usd
                type: object
              iteration:
                default: 0
                description: Bumped on every revise; forks and rollbacks refer to iterations.
                format: int32
                type: integer
              phase:
                enum:
                - Pending
                - Planned
                - Implementing
                - Verifying
                - Reviewing
                - Ready
                - Landing
                - Landed
                - Suspended
                - Failed
                - null
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Task
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workspaces.orchbus.io
spec:
  group: orchbus.io
  names:
    categories:
    - orchbus
    kind: Workspace
    plural: workspaces
    shortNames:
    - ws
    singular: workspace
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repo
      name: Repo
      type: string
    - jsonPath: .spec.verify
      name: Verify
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WorkspaceSpec via `CustomResource`
        properties:
          spec:
            description: A codebase a department works in, with the worktrees agents may be placed in.
            properties:
              bootstrap:
                description: Shell commands run in a fresh worktree before the agent starts.
                items:
                  type: string
                type: array
              pool:
                description: Pre-provisioned worktrees to bind tasks to before creating new ones.
                items:
                  type: string
                type: array
              repo:
                description: Absolute path of the main checkout on the node.
                type: string
              verify:
                description: Command whose success is the Task's `Verified` condition.
                nullable: true
                type: string
            required:
            - repo
            type: object
        required:
        - spec
        title: Workspace
        type: object
    served: true
    storage: true
